# Instances YAML (new spec)
#
# Basics
# - 1ファイル=1インスタンス
# - 必須: type (local|ssh)
# - 任意: name（未指定時はこのYAMLのファイル名stemが使われます）
# - SSHのみ: project_root(省略可; 既定: ~/ShogiArena-remote), host(必須), user(必須), port(既定:22), identity_file, is_strict_host_key_checking(既定:true)
# - hosts: [h1, h2, ...] を指定するとテンプレート展開（name-001, name-002, ...）

# Example 1: local
# type: local
# name: {yaml.stem} (default)
# slots: 4
# tags: ["local"]

# Example 2: ssh
# type: ssh (必須)
# name: {yaml.stem} (default)
# hosts: (必須)
#   - 203.0.113.10
#   - 203.0.113.11
# user: arena (必須)
## port: 22 (default)
# identity_file: ~/.ssh/arena_ed25519 (推奨)
# project_root: /home/{USER}/ShogiArena-remote (省略可)
# slots: 2 (必須)
## is_strict_host_key_checking: true (default)
# tags: ["remote", "8core"]
