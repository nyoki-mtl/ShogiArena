# アーティファクト用オーバーレイ設定例
# ------------------------------------------------------------------
# - `options` 以下を記述すると、対応するアーティファクト読み込み時に自動的に USI setoption としてマージされます。
# - 任意項目のみで構成されており、未指定の場合は空 dict が使われます。
# - ここに書いた値はエンジン個別の `options` より先に読み込まれ、後から上書き可能です。

options:
  # EvalDir: "./data/evals/SharedEval"      # 任意 (既定: 指定なし)。共有の評価関数（相対パスまたは絶対パス）
  # BookDir: "./data/books/latest"          # 任意 (既定: 指定なし)。共通定石ディレクトリ（相対パスまたは絶対パス）
  Threads: 4                                # 任意 (既定: 指定なし)。個別エンジン options で上書き可能
  NetworkDelay: 0                           # 任意 (既定: 指定なし)。YaneuraOu 固有オプション
  NetworkDelay2: 0
