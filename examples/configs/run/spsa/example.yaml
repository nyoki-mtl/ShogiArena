## Equivalent: shogiarena run spsa examples/configs/run/spsa/example.yaml

# SPSA example targeting the generic ShogiArena SPSA space protocol.

engines:
  # 実行前に、使用するSPSA対応engineのrepo名とcommit SHAへ置き換えてください。
  - artifact: "your-spsa-engine/0000000000000000000000000000000000000000"
    options:
      Threads: 2
      USI_Hash: 256
    # Single descriptor is enough; SPSA creates plus/minus variants from it.

dashboard:
  enabled: true
  api_port: 8080

# 同時対局数の上限はここで決まります。1 対局は engine プロセスを 2 つ使うため、
# `max_engines: 8` で同時 4 対局です。省略すると `slots: 4` の既定 (= 同時 2 対局) になり、
# 下の `num_parallel` を上げても増えません。
instances:
  - "../../resources/instances/local_example.yaml"

# Rules and initial positions
rules:
  initial_positions:
    type: "file"
    # run spsa reads start_sfens_path as raw SFEN rows; convert USI lines before using this file.
    source: "../../resources/openings/pair_positions.sfen"
    source_format: "sfen"
    flip_policy: "pair_both"
    sync_scope: "pair"  # Intent/validation guard for pair_both; the SPSA loop consumes SFEN rows.
  # 千日手扱いとする同一局面の出現回数（SPSAでも調整可能）
  repetition_occurrences_to_draw: 2

# SPSA loop and required inputs
spsa:
  space: "../../resources/spsa/rshogi-az-mcts.yaml"
  num_updates: 50
  pairs_per_update: 2
  inflight_factor: 4
  num_parallel: 4
  algorithm:
    name: classic
    alpha: 0.602
    gamma: 0.101
    A:
      mode: ratio
      value: 0.1
  variants:
    pairing: plus_minus
    crn: true
    integer_rounding: stochastic
    apply:
      clear_hash: true
      after_setoption: isready
  # `ltc_regression` (チューニング中の LTC 回帰テスト) はここでは設定していません。
  # 実行中に挟める標本サイズでは、検出できるのが破綻に近い劣化だけになるためです。
  # Stockfish/fishtest も SPSA の実行中には LTC 検証を挟みません。
  # チューニング結果の検証には、終了後に `run sprt` の独立ランを回してください。
  # 根拠と、それでも有効化する場合の条件は docs の「LTC 回帰テスト」にあります。
