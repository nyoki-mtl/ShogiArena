## Equivalent: shogiarena run sprt \
##   --engine artifact=yaneuraou/3570416 build_options.target_cpu=ZEN3 name=engine-1 tested=true \
##   --engine artifact=yaneuraou/9f89431a build_options.target_cpu=ZEN3 name=engine-2 \
##   --rules time_control.node_limit=100000 \
##   --sprt elo0=0.0 elo1=5.0 alpha=0.05 beta=0.05 min_games=0 max_games=400 num_parallel=1

experiment_name: "sprt_example"

engines:
  - name: "engine-1"
    artifact: "yaneuraou/3570416"
    build_options:
      target_cpu: ZEN3
  - name: "engine-2"
    artifact: "yaneuraou/9f89431a"
    build_options:
      target_cpu: ZEN3

rules:
  time_control:
    node_limit: 100000
  initial_positions:
    type: startpos
    flip_policy: alternate

sprt:
  elo0: 0.0
  elo1: 5.0
  alpha: 0.05
  beta: 0.05
  min_games: 0
  max_games: 400
  num_parallel: 1

dashboard:
  enabled: false
