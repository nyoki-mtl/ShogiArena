## Equivalent: shogiarena run spsa configs/run/spsa/example.yaml

# SPSA example targeting the generic ShogiArena SPSA space protocol.

engines:
  - artifact: "rshogi-az/local"
    options:
      Threads: 1
      USI_Hash: 256
    # Single descriptor is enough; SPSA creates plus/minus variants from it.

dashboard:
  enabled: true
  api_port: 8080

# Rules and initial positions
rules:
  initial_positions:
    type: "file"
    source: "./data/initial_sfens/start_sfens_ply24.txt"
  # 千日手扱いとする同一局面の出現回数（SPSAでも調整可能）
  repetition_occurrences_to_draw: 2

# SPSA loop and required inputs
spsa:
  space: "./configs/resources/spsa/rshogi-az-mcts.yaml"
  num_updates: 50
  pairs_per_update: 2
  inflight_factor: 4
  num_parallel: 4
  algorithm:
    name: classic
    alpha: 0.602
    gamma: 0.101
    A:
      mode: ratio
      value: 0.1
  variants:
    pairing: plus_minus
    crn: true
    integer_rounding: stochastic
    apply:
      clear_hash: true
      after_setoption: isready
