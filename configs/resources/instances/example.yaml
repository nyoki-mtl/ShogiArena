# Instances YAML (new spec)
#
# Basics
# - 1ファイル=1インスタンス
# - 必須: type (local|ssh)
# - 任意: name（未指定時はこのYAMLのファイル名stemが使われます）
# - SSHのみ: project_root(省略可; 既定: ~/ShogiArena-remote), host(必須), user(必須), port(既定:22), identity_file, strict_host_key_checking(既定:false)
# - hosts: [h1, h2, ...] を指定するとテンプレート展開（name-001, name-002, ...）

# Example 1: local
# type: local
# name: {yaml.stem} (default)
# slots: 4
# tags: ["local"]

# Example 2: ssh
# type: ssh (必須)
# name: {yaml.stem} (default)
# hosts: (必須)
#   - 34.100.10.1
#   - 34.100.10.2
# user: arena (必須)
## port: 22 (default)
# identity_file: ~/.ssh/google_compute_engine (推奨)
# project_root: /home/{USER}/ShogiArena-remote (省略可)
# slots: 2 (必須)
## strict_host_key_checking: false (default)
# tags: ["gcp", "e2-standard-2"]
