[project]
name = "shogiarena"
version = "0.3.1"
description = "Asynchronous tournament and SPSA tuning platform for USI shogi engines"
authors = [
    { name = "Hiroki Taniai", email = "charmer.popopo@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["shogi", "usi", "tournament", "spsa", "tuning", "engine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.12.15",
    "asyncssh>=2.21.0",
    "matplotlib>=3.10.5",
    "omegaconf>=2.3.0",
    "pandas>=2.3.2",
    "psutil>=6.0.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "rshogi-py-avx2==0.7.5",
    "sqlalchemy>=2.0.43",
    "tqdm>=4.67.1",
    "types-pyyaml>=6.0.12.20250822",
]

[project.urls]
Homepage = "https://github.com/nyoki-mtl/ShogiArena"
Repository = "https://github.com/nyoki-mtl/ShogiArena"
Documentation = "https://nyoki-mtl.github.io/ShogiArena"
Changelog = "https://github.com/nyoki-mtl/ShogiArena/blob/main/CHANGELOG.md"
Issues = "https://github.com/nyoki-mtl/ShogiArena/issues"

[project.scripts]
shogiarena = "shogiarena.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shogiarena"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/_refs",
    "/.sandbox",
    "/tests",
    "/stubs",
    "/agent-docs",
    "/visual-tests",
    "/.github",
    "/.devcontainer",
    "/.vscode",
    "/.serena",
    "/.claude",
    "/node_modules",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=0.26.0",
    "pytest>=8.3.4",
    "ruff>=0.9.9",
    "vulture>=2.14",
    "ty>=0.0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_refs", "work_dir", "node_modules", ".venv", ".git"]
addopts = ["-ra", "-q"]

[tool.ruff]
line-length = 120
exclude = ["_refs"]
src = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# Per-file rules
[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120

# ty configuration (type checker)
[tool.ty.environment]
python-version = "3.11"
root = ["src"]
extra-paths = ["stubs"]

[tool.ty.src]
include = ["src"]
exclude = [
    "_refs/**",
    "src/shogiarena/arena/services/btd.py",
    "src/shogiarena/tuning/spsa_tune.py",
    "src/shogiarena/tuning/spsa_runner.py",
]

[tool.ty.rules]
# Relax rules for third-party libraries without complete type stubs (rshogi, etc.)
# These can be tightened as ty matures and stubs improve
unresolved-attribute = "warn"
# D-1 ratchet step: invalid-return-type + invalid-argument-type
invalid-argument-type = "error"
# TypedDict discrimination limitations in ty (alpha)
invalid-key = "warn"
invalid-return-type = "error"
# Other alpha-stage limitations
invalid-assignment = "error"
invalid-type-form = "warn"
invalid-method-override = "warn"
no-matching-overload = "warn"
unsupported-operator = "warn"
