[project]
name = "shogiarena"
version = "1.2.7"
description = "Asynchronous tournament and SPSA tuning platform for USI shogi engines"
authors = [
    { name = "Hiroki Taniai", email = "charmer.popopo@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["shogi", "usi", "tournament", "spsa", "tuning", "engine"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14.1",
    "asyncssh>=2.24.0",
    "numpy>=2.0",
    "omegaconf>=2.3.1",
    "packaging>=24.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rsshogi>=1.1.1,<2",
    "sqlalchemy>=2.0.51",
    "typing-extensions>=4.16.0",
]

[project.urls]
Homepage = "https://github.com/nyoki-mtl/ShogiArena"
Repository = "https://github.com/nyoki-mtl/ShogiArena"
Documentation = "https://nyoki-mtl.github.io/ShogiArena"
Changelog = "https://github.com/nyoki-mtl/ShogiArena/blob/main/CHANGELOG.md"
Issues = "https://github.com/nyoki-mtl/ShogiArena/issues"

[project.scripts]
shogiarena = "shogiarena.cli:main"

[tool.hatch.build]
artifacts = [
    "src/shogiarena/py.typed",
    "src/shogiarena/_core/interfaces/dashboard/static/dist/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shogiarena"]
# dashboard の frontend は build 済みバンドル（static/dist）を同梱すれば動く。
# ランタイムが読むのは frontend/index.html だけなので、TypeScript ソースと
# テスト、ビルド設定は wheel に含めない。
exclude = [
    "/src/shogiarena/_core/interfaces/dashboard/frontend/src",
    "/src/shogiarena/_core/interfaces/dashboard/frontend/*.ts",
    "/src/shogiarena/_core/interfaces/dashboard/frontend/*.cjs",
    "/src/shogiarena/_core/interfaces/dashboard/frontend/*.json",
]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "shogiarena/_worker_bundle_resources/pyproject.toml"
"uv.lock" = "shogiarena/_worker_bundle_resources/uv.lock"
"README.md" = "shogiarena/_worker_bundle_resources/README.md"

[tool.hatch.build.targets.sdist]
# 除外リスト方式だと、.gitignore の否定パターン（!.claude/settings.json など）が
# 除外を上書きしたり、新しく増えた生成物ディレクトリが黙って同梱されたりする。
# 公開物は許可リストで決める。追加は意図的な変更としてのみ行う。
include = [
    "/src",
    "/examples",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "vulture>=2.16",
    "ty>=0.0.61",
    "types-pyyaml>=6.0.12.20250822",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_refs", "work_dir", "node_modules", ".venv", ".git"]
addopts = ["-ra", "-q"]

[tool.ruff]
line-length = 120
exclude = ["_refs"]
src = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# Per-file rules
[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120

# ty configuration (type checker)
[tool.ty.environment]
python-version = "3.11"
root = ["src"]
extra-paths = ["stubs"]

[tool.ty.src]
include = ["src"]
exclude = ["_refs/**"]

[tool.ty.rules]
# Relax rules for third-party libraries without complete type stubs (rsshogi, etc.)
# These can be tightened as ty matures and stubs improve
unresolved-attribute = "warn"
# D-1 ratchet step: invalid-return-type + invalid-argument-type
invalid-argument-type = "error"
# TypedDict discrimination limitations in ty (alpha)
invalid-key = "warn"
invalid-return-type = "error"
# Other alpha-stage limitations
invalid-assignment = "error"
invalid-type-form = "warn"
invalid-method-override = "warn"
no-matching-overload = "warn"
unsupported-operator = "warn"
