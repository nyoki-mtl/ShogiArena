name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.44"

      - name: Build mdbook site
        run: mdbook build docs/book

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/build

  deploy:
    # Only deploy to GitHub Pages on public repository (nyoki-mtl/ShogiArena)
    # Skip deployment on private dev repository to avoid Pages configuration errors
    if: github.repository == 'nyoki-mtl/ShogiArena'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
