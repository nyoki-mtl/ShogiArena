name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.15"
          cache: pip
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Sync documentation dependencies
        run: uv sync --all-extras

      - name: Ensure MkDocs toolchain
        run: uv pip install mkdocs mkdocs-material mkdocs-minify-plugin

      - name: Build MkDocs site
        run: uv run mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only deploy to GitHub Pages on public repository (nyoki-mtl/ShogiArena)
    # Skip deployment on private dev repository to avoid Pages configuration errors
    if: github.repository == 'nyoki-mtl/ShogiArena'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
