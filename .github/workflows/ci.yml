name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  python-quality:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
          cache: 'pip'
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Sync Python dependencies
        run: uv sync --all-extras

      - name: Ensure Python tooling is installed
        run: uv pip install ruff ty pytest pytest-asyncio

      - name: Verify CLI version
        run: uv run shogiarena --version

      - name: Ruff lint
        run: uv run ruff check . --config=pyproject.toml

      - name: Ty type check
        run: uv run ty check src/

      - name: Pytest
        run: uv run pytest

  frontend-quality:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Biome lint
        run: npm run frontend:lint

      - name: Vitest
        run: npm run frontend:test

  frontend-build:
    name: Frontend Build Artifact
    needs: frontend-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run frontend:build

      - name: Upload dashboard dist
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: src/shogiarena/web/dashboard/static/dist

  package-smoke:
    name: Build Wheel (Smoke)
    needs:
      - python-quality
      - frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: src/shogiarena/web/dashboard/static/dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
          cache: 'pip'
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Sync Python dependencies
        run: uv sync --all-extras

      - name: Install build tooling
        run: uv pip install build

      - name: Build package
        run: uv run python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist
