name: Public Release

on:
  push:
    tags:
      - "v*"

# 既定は read のみ。GitHub Release 作成ジョブだけが contents: write を持つ。
permissions:
  contents: read

jobs:
  validate-version:
    if: github.repository == 'nyoki-mtl/ShogiArena'
    name: Validate version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Check pyproject / __init__ / tag agree
        run: |
          set -euo pipefail
          PYPROJECT_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
          INIT_VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/shogiarena/__init__.py | head -n1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml           : ${PYPROJECT_VERSION}"
          echo "src/shogiarena/__init__.py: ${INIT_VERSION}"
          echo "tag                      : ${TAG_VERSION}"
          if [ -z "${PYPROJECT_VERSION}" ]; then
            echo "::error::could not read version from pyproject.toml"
            exit 1
          fi
          if [ -z "${INIT_VERSION}" ]; then
            echo "::error::could not read __version__ from src/shogiarena/__init__.py"
            exit 1
          fi
          if [ "${PYPROJECT_VERSION}" != "${INIT_VERSION}" ]; then
            echo "::error::pyproject.toml (${PYPROJECT_VERSION}) and __init__.py (${INIT_VERSION}) disagree"
            exit 1
          fi
          if [ "${TAG_VERSION}" != "${PYPROJECT_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${PYPROJECT_VERSION}"
            exit 1
          fi

  build:
    if: github.repository == 'nyoki-mtl/ShogiArena'
    name: Build Distributions
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run frontend:build

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Validate published example configs
        run: uv run python tools/check_example_configs.py

      - name: Build package
        run: uv build

      - name: Inspect package contents and dashboard runtime assets
        run: uv run python tools/check_distribution_artifacts.py dist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist
          path: dist

  publish:
    if: github.repository == 'nyoki-mtl/ShogiArena' && startsWith(github.ref, 'refs/tags/v')
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Trusted Publishing（OIDC）。長期の API トークンを保持しない。
    # PyPI 側で publisher（repo / workflow / environment）の登録が必要。
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist
          skip-existing: true

  release:
    if: github.repository == 'nyoki-mtl/ShogiArena'
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* --generate-notes
          fi
