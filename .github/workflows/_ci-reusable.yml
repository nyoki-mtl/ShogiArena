name: Common CI

on:
  workflow_call:
    inputs:
      make_target:
        description: "Make target that defines the repository's canonical CI contract."
        required: false
        type: string
        default: "ci"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync Python dependencies
        run: uv sync --all-extras

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run canonical CI target
        run: make ${{ inputs.make_target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist
