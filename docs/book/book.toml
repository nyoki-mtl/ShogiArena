[book]
title = "ShogiArena Documentation"
authors = ["ShogiArena Developers"]
language = "ja"
description = "ShogiArena - 将棋AIエンジンの自動対局・レーティング管理システムのドキュメント。"

[build]
build-dir = "build"
create-missing = false

[output.html]
# 数式は theme/head.hbs で MathJax を読み込んで描画する。
# mdbook 0.5 で mathjax-support オプションが廃止されたため、theme 側に置いている。
default-theme = "navy"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/nyoki-mtl/ShogiArena"
additional-css = ["theme/custom.css"]

[output.html.print]
enable = false
